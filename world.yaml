# Aparência controlada da vegetação. As regras são aplicadas na ordem;
# regras posteriores substituem somente os valores que declaram.
vegetation:
  assets:
    large: [t1, t2]          # árvores grandes
    small: [t3, t4]          # árvores pequenas
    large_stump: [t5, t6]    # tocos grandes
    small_stump: [t7, t8]    # tocos pequenos

  defaults:
    large: 0
    small: 1
    large_stump: 1
    small_stump: 1

  rules:
    - when:
        min_files: 40
      trees:
        large: 1
        small: 3
        large_stump: 1
        small_stump: 1

    - when:
        min_files: 200
        min_directories: 10
      trees:
        large: 2
        small: 2
        large_stump: 1
        small_stump: 2

    - when:
        has_tests: true
        has_docs: true
      trees:
        small: 3

  # Ajustes por nome têm prioridade sobre defaults e regras automáticas.
  repositories:
    github-world:
      trees:
        large: 3
        small: 4
        large_stump: 2
        small_stump: 5

  flowers:
    assets: [flower1, flower2, flower3]
    default_density: 5

    rules:
      - when:
          min_files: 40
        density: 8

      - when:
          min_depth: 2
          has_docs: true
        density: 10

    # Esta substituição tem prioridade sobre o padrão e as regras acima.
    repositories:
      github-world:
        density: 12

farm:
  defaults:
    enabled: true
    beds: 3
    flowers: 6
    extra_rocks: 5
    grass: 8
    barrels: 3

  repositories:
    github-world:
      enabled: true
      beds: 3
      flowers: 7
      extra_rocks: 7
      grass: 12
      barrels: 4

# Identidade da casa principal. Opções: auto, green, orange ou gray.
# Em auto, o nome do repositório escolhe uma cor estável.
house:
  defaults:
    style: auto

  repositories:
    github-world:
      style: orange
